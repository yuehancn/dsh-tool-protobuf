syntax = "proto3";

package acme.billing.v1;

import "google/protobuf/timestamp.proto";
import "acme/common/money.proto";

option java_package = "com.acme.billing.v1";
option go_package = "acme/billing/v1;billingv1";

// Status of an invoice as the billing system tracks it.
// Not the same as the payment state — see PaymentState.
enum InvoiceStatus {
  INVOICE_STATUS_UNSPECIFIED = 0;
  INVOICE_STATUS_DRAFT = 1;
  INVOICE_STATUS_ISSUED = 2;
  INVOICE_STATUS_PAID = 3;
  INVOICE_STATUS_VOID = 4;
}

enum PaymentState {
  PAYMENT_STATE_UNSPECIFIED = 0;
  PAYMENT_STATE_PENDING = 1;
  PAYMENT_STATE_SETTLED = 2;
  PAYMENT_STATE_FAILED = 3;
}

// A line item on an invoice. Amounts are always in minor units.
message LineItem {
  string description = 1;
  int64 amount_minor = 2;
  string currency = 3;
  int32 quantity = 4;
  // Tax rate in basis points, so 1900 is 19%.
  int32 tax_rate_bps = 5;
  acme.common.Money unit_price = 6;
}

message Customer {
  string customer_id = 1;
  string display_name = 2;
  string email = 3;
  Address billing_address = 4;

  message Address {
    string line1 = 1;
    string line2 = 2;
    string city = 3;
    string postal_code = 4;
    string country_code = 5;
  }
}

message Invoice {
  string invoice_id = 1;
  string customer_id = 2;
  InvoiceStatus status = 3;
  PaymentState payment_state = 4;
  google.protobuf.Timestamp issued_at = 5;
  google.protobuf.Timestamp due_at = 6;
  repeated LineItem line_items = 7;
  Customer customer = 8;
  int64 total_minor = 9;
  string currency = 10;
  map<string, string> labels = 11;
  oneof delivery {
    string pdf_url = 12;
    string hosted_url = 13;
  }
  reserved 14, 15;
  reserved "legacy_vat_number";
}

message GetInvoiceRequest {
  string invoice_id = 1;
}

message GetInvoiceResponse {
  Invoice invoice = 1;
}

message ListInvoicesRequest {
  string customer_id = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message ListInvoicesResponse {
  repeated Invoice invoices = 1;
  string next_page_token = 2;
}

service BillingService {
  // Fetch one invoice by id.
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  // Stream invoices for a customer as they are read.
  rpc ListInvoices(ListInvoicesRequest) returns (stream ListInvoicesResponse);
  // Upload reconciliation files; the server replies once at the end.
  rpc UploadReconciliation(stream LineItem) returns (GetInvoiceResponse);
  // Both directions stream for long-running reconciliation.
  rpc Reconcile(stream LineItem) returns (stream ListInvoicesResponse);
}